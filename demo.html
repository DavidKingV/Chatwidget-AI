<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alexandra - UNIF</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f3f4f6;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 620px;
    }

    h1 {
      font-size: 18px;
      color: #374151;
      margin: 0 0 16px;
      text-align: center;
    }

    .chat-shell {
      width: 100%;
      height: 720px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      border-radius: 12px;
      overflow: hidden;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Alexandra &mdash; UNIF</h1>

    <div class="chat-shell"
         data-kinetix-chat
         data-webhook-url="https://n8n.aiethereus.com/webhook/00acb4c7-5399-404b-b791-c326202e4698/chat"
         data-route="alexandra"
         data-brand-name="Alexandra"
         data-brand-status="En línea"
         data-footer-text="Protegido bajo estándares de confidencialidad médica."
         data-primary-color="#0f766e"
         data-user-bubble-color="#1f2937"
         data-user-bubble-text-color="#ffffff"
         data-bot-bubble-color="#ffffff"
         data-bot-bubble-text-color="#1f2937"
         data-background-color="#fafafa"
         data-placeholder="Describe tus síntomas aquí..."
         data-welcome-message="Hola. Soy Alexandra, tu asistente virtual de la clínica UNIF. Para ayudarte a orientar tu caso antes de tu visita, por favor descríbeme: ¿dónde sientes el dolor y cómo ocurrió la lesión?"
         data-clear-label="Borrar conversación"
         data-confirm-text="¿Borrar toda la conversación?"
         data-confirm-yes="Sí, borrar"
         data-confirm-no="Cancelar"
         data-error-message="No pude conectar con el asistente. Intenta de nuevo."
         data-today-label="Hoy"
         data-typing-label="escribiendo..."></div>
  </div>

  <script src="kinetixchat.js" defer></script>
</body>

</html>
